[project]
name = "doifetch"
version = "0.1.0"
description = "Batch academic paper downloader for open and institutional sources"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests",
]

[project.optional-dependencies]
# HTML parsing for the opt-in shadow-library sources (scihub, libgen).
shadow = ["beautifulsoup4"]

[project.scripts]
doifetch = "fetch:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = [
    "config",
    "fetch",
    "fetch_crossref",
    "fetch_ezproxy",
    "fetch_hal",
    "fetch_istex",
    "fetch_libgen",
    "fetch_scihub",
    "fetch_unpaywall",
    "fetch_url",
    "pdf_utils",
    "utils",
    "zotero",
]

[dependency-groups]
dev = [
    "doifetch[shadow]",
    "pytest",
    "ruff",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "network: tests that make real HTTP requests (deselect with -m 'not network')",
]

[tool.uv]
package = true

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "BLE"]
ignore = ["E501"]  # line length is left to ruff format
