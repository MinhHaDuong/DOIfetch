[project]
name = "doifetch"
version = "0.1.0"
description = "Batch academic paper downloader for open and institutional sources"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "beautifulsoup4",
    "openpyxl",
    "pandas",
    "requests",
    "tqdm",
    "xlrd",
]

[project.scripts]
doifetch = "fetch:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = [
    "config",
    "fetch",
    "fetch_crossref",
    "fetch_ezproxy",
    "fetch_hal",
    "fetch_istex",
    "fetch_libgen",
    "fetch_scihub",
    "fetch_unpaywall",
    "fetch_url",
    "pdf_utils",
    "utils",
    "zotero",
]

[dependency-groups]
dev = [
    "pytest",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "network: tests that make real HTTP requests (deselect with -m 'not network')",
]

[tool.uv]
package = true
