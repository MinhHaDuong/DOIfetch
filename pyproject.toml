[project]
name = "doifetch"
version = "0.3.0"
description = "Batch academic paper downloader for open and institutional sources"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
# Empty: scihub and libgen parse HTML with the standard library. Kept for
# one release so that existing `doifetch[shadow]` pins still resolve; remove it next.
shadow = []

[project.scripts]
doifetch = "doifetch.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = [
    "mypy",
    "pytest",
    "ruff",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "network: tests that make real HTTP requests (deselect with -m 'not network')",
]

[tool.uv]
package = true

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "BLE"]
ignore = ["E501"]  # line length is left to ruff format

[tool.mypy]
files = ["src/doifetch"]
python_version = "3.10"
ignore_missing_imports = true
